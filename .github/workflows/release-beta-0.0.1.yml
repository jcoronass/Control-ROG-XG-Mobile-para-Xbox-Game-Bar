name: Build & Publish Beta 0.0.1 (MSIX)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-beta:
    runs-on: windows-2022

    env:
      RELEASE_TAG: beta-0.0.1
      RELEASE_TITLE: "Beta 0.0.1 — XG Mobile RTX 5070 Ti Game Bar Widget"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild (Visual Studio 2022 nativo vía vswhere)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuildExe = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuildExe) {
            $msbuildExe = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Filter "MSBuild.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\Bin\\MSBuild\.exe$" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $msbuildExe) {
            Write-Error "No se encontró MSBuild.exe de Visual Studio 2022 en el runner."
            exit 1
          }
          $msbuildDir = Split-Path -Parent $msbuildExe
          Write-Host "MSBuild detectado en: $msbuildExe"
          Add-Content -Path $env:GITHUB_PATH -Value $msbuildDir

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Alinear versión de Windows SDK instalada en el runner
        shell: powershell
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Extension SDKs\WindowsDesktop"
          $chosen = Get-ChildItem -Path $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "Windows SDK detectado: $chosen"
          if ($chosen -and $chosen -ne "10.0.22621.0") {
            $files = @(
              "XGMobile.Widget\XGMobile.Widget.csproj",
              "XGMobile.Package\XGMobile.Package.wapproj",
              "XGMobile.Helper\XGMobile.Helper.csproj"
            )
            foreach ($f in $files) {
              $text = Get-Content $f -Raw
              $text = $text -replace "10\.0\.22621\.0", $chosen
              Set-Content -Path $f -Value $text -Encoding UTF8
            }
          }

      - name: Generar iconos PNG requeridos para UWP y Packaging Project
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing

          function New-WidgetIcon($path, $w, $h) {
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255, 14, 18, 24))
            $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255, 22, 163, 74), [Math]::Max(2, [int]([Math]::Min($w, $h) / 14)))
            $margin = [int]([Math]::Min($w, $h) * 0.2)
            $g.DrawRectangle($pen, $margin, $margin, $w - ($margin * 2), $h - ($margin * 2))
            $g.Dispose()
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }

          $dirs = @("XGMobile.Widget\Assets", "XGMobile.Package\Images")
          foreach ($dir in $dirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            New-WidgetIcon "$dir\StoreLogo.png" 50 50
            New-WidgetIcon "$dir\Square44x44Logo.png" 44 44
            New-WidgetIcon "$dir\Square150x150Logo.png" 150 150
            New-WidgetIcon "$dir\Wide310x150Logo.png" 310 150
            New-WidgetIcon "$dir\SplashScreen.png" 620 300
            New-WidgetIcon "$dir\LockScreenLogo.png" 24 24
          }

      - name: Generar certificado de firma de prueba (Beta Sideload)
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XGMobileBetaDev" `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(3) `
            -FriendlyName "XGMobileBeta001" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "XGMobileBeta001!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "XGMobile.Package\XGMobileBeta_TempKey.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "XGMobile.Package\XGMobileBeta.cer" | Out-Null

      - name: Restaurar dependencias NuGet (UWP + .NET 8 Win32)
        shell: powershell
        run: |
          dotnet restore XGMobile.Helper\XGMobile.Helper.csproj -r win-x64
          msbuild XGMobile.Widget\XGMobile.Widget.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          msbuild XGMobile.Package\XGMobile.Package.wapproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Compilar y empaquetar MSIX firmado (Release x64)
        shell: powershell
        run: |
          $pfxPath = Join-Path "${{ github.workspace }}" "XGMobile.Package\XGMobileBeta_TempKey.pfx"
          msbuild XGMobile.Package\XGMobile.Package.wapproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$pfxPath" `
            /p:PackageCertificatePassword="XGMobileBeta001!" `
            /p:AppxPackageDir="${{ github.workspace }}\AppPackages\"

      - name: Preparar paquete ZIP listo para doble clic en consola
        shell: powershell
        run: |
          $stage = "release-beta-0.0.1"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $pkgs = Get-ChildItem -Path "AppPackages" -Recurse -Include *.msix,*.appx
          if ($pkgs.Count -eq 0) {
            Write-Error "No se generó ningún paquete .msix/.appx en AppPackages."
            exit 1
          }

          $pkgs | Copy-Item -Destination $stage
          Copy-Item "XGMobile.Package\XGMobileBeta.cer" -Destination $stage
          Copy-Item "Instalar-DobleClick.bat" -Destination $stage
          Copy-Item "Install-XGMobileWidget.ps1" -Destination $stage
          Copy-Item "XGMobile.Helper\games_profiles.json" -Destination $stage

          Compress-Archive -Path "$stage\*" -DestinationPath "XGMobile-GameBar-Beta-0.0.1.zip" -Force
          Get-ChildItem -Path $stage

      - name: Subir artefacto en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: XGMobile-GameBar-Beta-0.0.1
          path: |
            XGMobile-GameBar-Beta-0.0.1.zip
            release-beta-0.0.1/

      - name: Crear o actualizar GitHub Release beta-0.0.1
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          ## XG Mobile RTX 5070 Ti — Xbox Game Bar Widget (Beta 0.0.1)

          Compilación automática para consola handheld Windows 11 con **AMD Ryzen Z2 Extreme (VEN_1002)** + **ASUS XG Mobile NVIDIA RTX 5070 Ti (VEN_10DE)**.

          ### Instalación en 1 paso (doble clic en tu consola, sin Modo para programadores)
          1. Descarga **`XGMobile-GameBar-Beta-0.0.1.zip`** y descomprímelo.
          2. Haz **doble clic en `Instalar-DobleClick.bat`** y acepta el aviso de administrador (instala el certificado Beta y el paquete `.msix` firmado).
          3. Pulsa el **botón Xbox** o **`Win + G`**, abre **Widgets** y fija **`XG Mobile RTX 5070 Ti`**.
          4. Personaliza tus juegos en **`C:\eGPU_Profiles\games_profiles.json`**.
          "@

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          cmd /c "gh release view $env:RELEASE_TAG >nul 2>&1"
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG "XGMobile-GameBar-Beta-0.0.1.zip" --clobber
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes $notes --prerelease
          } else {
            gh release create $env:RELEASE_TAG "XGMobile-GameBar-Beta-0.0.1.zip" `
              --title $env:RELEASE_TITLE `
              --notes $notes `
              --prerelease
          }
